name: Gozine2 public archive recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 lxml
      - name: Recover public archive traces
        run: python scripts/gozine2_public_recovery.py
      - name: Show summary
        if: always()
        run: |
          test -f artifacts/gozine2/summary.json && cat artifacts/gozine2/summary.json || true
          test -f artifacts/gozine2/crawl_failures.json && cat artifacts/gozine2/crawl_failures.json || true
      - name: Upload recovery bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gozine2-public-recovery
          path: artifacts/gozine2/
          if-no-files-found: warn
          retention-days: 7
