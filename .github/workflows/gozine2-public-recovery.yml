name: Gozine2 endpoint archive probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade requests
      - name: Probe historical public API captures
        run: python scripts/gozine2_endpoint_probe.py
      - name: Show summary
        if: always()
        run: |
          test -f artifacts/gozine2-endpoints/summary.json && cat artifacts/gozine2-endpoints/summary.json || true
      - name: Upload endpoint archaeology
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gozine2-endpoint-archive
          path: artifacts/gozine2-endpoints/
          if-no-files-found: warn
          retention-days: 7
