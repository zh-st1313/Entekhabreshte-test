name: Build verified 1404 staging

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/1404-build-verified.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results

      - name: Merge current matches with visual review by admission message
        run: |
          python - <<'PY'
          import csv,os,json,re

          paired=list(csv.DictReader(open("scratch/siibtorsh-1404-safe/paired.csv",encoding="utf-8-sig")))
          paired=[r for r in paired if str(r.get("quota_rank","")).strip()]

          # review_id -> course review
          review={}
          with open("scratch/siibtorsh-1404-course-review/course_type_review.csv",encoding="utf-8-sig",newline="") as f:
              for r in csv.DictReader(f):
                  review[int(r["review_id"])]=r

          # review_id -> stable admission_msg from the sheet manifest.
          manifest=json.load(open("scratch/siibtorsh-1404-course-review/detail-sheets/manifest.json",encoding="utf-8"))
          rid_to_msg={int(x["rid"]):str(x["admission_msg"]) for x in manifest}
          review_by_msg={}
          for rid,rv in review.items():
              msg=rid_to_msg.get(rid)
              if msg and rv.get("review_status")=="verified_visual" and rv.get("course_type"):
                  review_by_msg[msg]=rv

          majors=[
              "دندانپزشکی","دامپزشکی","فیزیوتراپی","داروسازی","پزشکی",
              "بینایی سنجی","بینایی‌سنجی","شنوایی شناسی","شنوایی‌شناسی",
              "علوم آزمایشگاهی","اتاق عمل","هوشبری","پرستاری","مامایی",
              "کاردرمانی","گفتاردرمانی","رادیولوژی","بهداشت"
          ]
          def split_admission(s):
              s=re.sub(r'\s+',' ',(s or "").strip())
              for m in majors:
                  if s.startswith(m):
                      return m.replace("‌"," "),s[len(m):].strip(" ‌-–|")
              p=s.split(" ",1)
              return p[0],p[1] if len(p)>1 else ""

          out=[]
          queue=[]
          for r in paired:
              msg=str(r["admission_msg"])
              rv=review_by_msg.get(msg)
              major,university=split_admission(r["admission_raw"])
              base={
                  "year":"1404","group":"تجربی",
                  "quota":r["quota"],"quota_rank":r["quota_rank"],
                  "major":major,"university":university,
                  "course_type":rv.get("course_type","") if rv else "",
                  "semester":rv.get("semester","") if rv else "",
                  "name":r["name"],"rank_msg":r["rank_msg"],
                  "admission_msg":r["admission_msg"],"sequence":r["sequence"],
                  "match_method":r["match_method"],
                  "course_review_status":"verified_visual" if rv else "needs_visual_review"
              }
              (out if rv else queue).append(base)

          os.makedirs("scratch/siibtorsh-1404-final-staging",exist_ok=True)
          fields=["year","group","quota","quota_rank","major","university","course_type","semester","name","rank_msg","admission_msg","sequence","match_method","course_review_status"]
          with open("scratch/siibtorsh-1404-final-staging/verified_1404.csv","w",encoding="utf-8-sig",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(out)
          with open("scratch/siibtorsh-1404-final-staging/course_review_queue.csv","w",encoding="utf-8-sig",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(queue)

          # factual duplicate audit
          seen={}
          dups=[]
          for i,r in enumerate(out,2):
              k=(r["quota"],r["quota_rank"],r["major"],r["university"],r["course_type"],r["semester"])
              if k in seen:
                  dups.append({"first_line":seen[k],"duplicate_line":i,"key":k,"name":r["name"],"admission_msg":r["admission_msg"]})
              else:
                  seen[k]=i

          sm={
              "current_safe_pairs":len(paired),
              "visual_reviews_keyed_by_admission_msg":len(review_by_msg),
              "verified_current_records":len(out),
              "current_review_queue":len(queue),
              "internal_exact_duplicates":len(dups)
          }
          json.dump(sm,open("scratch/siibtorsh-1404-final-staging/summary.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          json.dump(dups,open("scratch/siibtorsh-1404-final-staging/internal_duplicates.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print(json.dumps(sm,ensure_ascii=False))
          PY

      - name: Commit corrected verified staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/siibtorsh-1404-final-staging
          git diff --cached --quiet && exit 0
          git commit -m "fix: key 1404 visual reviews by admission message"
          git pull --rebase origin extract-sibtorsh-results
          git push origin HEAD:extract-sibtorsh-results
