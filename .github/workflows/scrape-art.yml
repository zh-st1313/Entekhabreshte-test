name: Probe Kanoon art scraper

on:
  push:
    paths:
      - "scripts/scrape_kanoon_art.py"
      - ".github/workflows/scrape-art.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/scrape_kanoon_art.py --probe
