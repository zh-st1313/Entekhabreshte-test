name: Gozine2 deep old recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 lxml
      - name: Deep crawl
        run: python scripts/gozine2_deep_old.py
      - name: Show summary
        if: always()
        run: |
          test -f artifacts/gozine2-deep-old/summary.json && cat artifacts/gozine2-deep-old/summary.json || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gozine2-deep-old
          path: artifacts/gozine2-deep-old/
          if-no-files-found: warn
          retention-days: 7
