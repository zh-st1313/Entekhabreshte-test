name: ZedOne client asset exposure review
on:
  push:
    branches:
      - security/vps-toolkit
    paths:
      - security/vps-toolkit/scripts/client-asset-review.py
      - .github/workflows/zedone-client-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zedone-client-review
  cancel-in-progress: true

jobs:
  inspect-public-client-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile security/vps-toolkit/scripts/client-asset-review.py
      - name: Review up to two same-origin browser assets without logging source
        run: python3 security/vps-toolkit/scripts/client-asset-review.py
