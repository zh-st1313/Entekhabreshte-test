name: Merge Chiho ranks into 1404 admissions

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/chiho-1404-merge.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results

      - name: Build safe merged staging
        run: |
          python - <<'PY'
          import json,csv,re,unicodedata,collections,os
          from difflib import SequenceMatcher

          digitmap=str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩","01234567890123456789")
          def en(x): return (x or "").translate(digitmap)
          def norm(x):
              x=unicodedata.normalize("NFKC",x or "")
              x=x.replace("ي","ی").replace("ك","ک").replace("ۀ","ه").replace("ة","ه")
              x=re.sub(r'[\u200c\u200e\u200f\ufeff]',' ',x)
              x=re.sub(r'\b(سید|سیده)\b',' ',x)
              return re.sub(r'[^آ-یA-Za-z0-9]','',x).lower()
          def nq(q):
              q=en(q).replace("منطقه یک","منطقه 1").replace("منطقه دو","منطقه 2").replace("منطقه سه","منطقه 3")
              q=q.replace("منطقه ۱","منطقه 1").replace("منطقه ۲","منطقه 2").replace("منطقه ۳","منطقه 3")
              return q.strip()

          raw=[]
          d=json.load(open("scratch/chiho-1404-ranks-part1.json",encoding="utf-8"))
          raw += d["rows"]
          d=json.load(open("scratch/siibtorsh-1404-recovery/region-search-universe-v3.json",encoding="utf-8"))
          raw += d
          d=json.load(open("scratch/siibtorsh-1404-recovery/major-search-universe.json",encoding="utf-8"))
          raw += d
          for p in [
              "scratch/chiho-1404-ranks-after-48055-part1.json",
              "scratch/chiho-1404-ranks-after-48055-part2.json",
              "scratch/chiho-1404-ranks-after-48055-part3.json",
              "scratch/chiho-1404-ranks-after-48055-part4.json"
          ]:
              d=json.load(open(p,encoding="utf-8"))
              raw += d.get("rows",[])
          p="scratch/siibtorsh-1404-recovery/batch01.json"
          if os.path.exists(p):
              for item in json.load(open(p,encoding="utf-8")):
                  for h in item.get("hits",[]):
                      raw.append({"id":h["id"],"name":item["name"],"rank":h["rank"],"quota":h["quota"]})

          # De-duplicate source messages.
          tmp={}
          for r in raw:
              try:
                  rr={"id":int(r["id"]),"name":r["name"].strip(),"key":norm(r["name"]),
                      "rank":int(en(str(r["rank"]))),"quota":nq(r["quota"])}
              except Exception:
                  continue
              if rr["key"] and rr["quota"]:
                  tmp[(rr["id"],rr["key"],rr["rank"],rr["quota"])]=rr
          clean=list(tmp.values())

          by_id={}
          by_name=collections.defaultdict(list)
          for r in clean:
              by_id[r["id"]]=r
              by_name[r["key"]].append(r)

          canonical={}
          conflicts={}
          for k,arr in by_name.items():
              vals=collections.Counter((x["rank"],x["quota"]) for x in arr)
              if len(vals)==1:
                  (rank,quota),cnt=next(iter(vals.items()))
                  canonical[k]={"rank":rank,"quota":quota,"count":cnt,"sample_id":arr[0]["id"]}
              else:
                  # Accept a strong majority only; otherwise hold out for manual review.
                  common=vals.most_common()
                  (rank,quota),cnt=common[0]
                  total=sum(vals.values())
                  if cnt>=2 and cnt/total>=0.67:
                      canonical[k]={"rank":rank,"quota":quota,"count":cnt,"sample_id":next(x["id"] for x in arr if x["rank"]==rank and x["quota"]==quota)}
                  conflicts[k]=[{"rank":a,"quota":b,"count":c} for (a,b),c in vals.items()]

          ads=[]
          with open("scratch/siibtorsh-1404-text/staging_text.csv",encoding="utf-8-sig",newline="") as f:
              ads=list(csv.DictReader(f))

          keys=list(canonical)
          out=[]
          counts=collections.Counter()
          for a in ads:
              k=norm(a["name"])
              r=None; method=""; score=""

              rl=str(a.get("rank_link") or "").strip()
              if rl.isdigit() and int(rl) in by_id:
                  cand=by_id[int(rl)]
                  nk=cand["key"]
                  sim=SequenceMatcher(None,k,nk).ratio()
                  compatible=(k==nk or k.startswith(nk) or nk.startswith(k) or sim>=0.88)
                  if compatible:
                      r=cand; method="direct_rank_link"; score=f"{sim:.3f}"

              if r is None and k in canonical:
                  cc=canonical[k]
                  r={"id":cc["sample_id"],"key":k,"rank":cc["rank"],"quota":cc["quota"]}
                  method="exact_name"; score="1.000"

              if r is None and k:
                  scored=[]
                  for rk in keys:
                      if k.startswith(rk) or rk.startswith(k):
                          sim=max(SequenceMatcher(None,k,rk).ratio(),0.94)
                      else:
                          sim=SequenceMatcher(None,k,rk).ratio()
                      if sim>=0.93:
                          scored.append((sim,rk))
                  scored.sort(reverse=True)
                  if scored and (len(scored)==1 or scored[0][0]-scored[1][0]>=0.05):
                      sim,rk=scored[0]
                      cc=canonical[rk]
                      r={"id":cc["sample_id"],"key":rk,"rank":cc["rank"],"quota":cc["quota"]}
                      method="high_conf_name"; score=f"{sim:.3f}"

              out.append({
                  "name":a["name"],
                  "quota":r["quota"] if r else "",
                  "quota_rank":r["rank"] if r else "",
                  "admission_raw":a["admission_raw"],
                  "rank_msg":r["id"] if r else "",
                  "rank_link":a.get("rank_link",""),
                  "admission_msg":a["admission_msg"],
                  "sequence":a["sequence"],
                  "match_method":method,
                  "match_score":score
              })
              counts[method or "unmatched"]+=1

          os.makedirs("scratch/siibtorsh-1404-safe",exist_ok=True)
          fields=["name","quota","quota_rank","admission_raw","rank_msg","rank_link","admission_msg","sequence","match_method","match_score"]
          with open("scratch/siibtorsh-1404-safe/paired.csv","w",encoding="utf-8-sig",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(out)

          unmatched=[x["name"] for x in out if x["quota_rank"]==""]
          with open("scratch/siibtorsh-1404-safe/unmatched_names.json","w",encoding="utf-8") as f:
              json.dump(unmatched,f,ensure_ascii=False,indent=2)

          summary={
              "rank_messages_total":len(clean),
              "unique_rank_names":len(canonical),
              "rank_name_conflicts":len(conflicts),
              "admissions":len(out),
              "matched":sum(bool(x["quota_rank"]) for x in out),
              "unmatched":len(unmatched),
              "methods":dict(counts)
          }
          json.dump(summary,open("scratch/siibtorsh-1404-safe/summary.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          json.dump(conflicts,open("scratch/siibtorsh-1404-safe/conflicts.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print(json.dumps(summary,ensure_ascii=False))
          PY

      - name: Commit safe staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/siibtorsh-1404-safe
          git diff --cached --quiet && exit 0
          git commit -m "extract: merge expanded 1404 rank sources safely"
          git pull --rebase origin extract-sibtorsh-results
          git push origin HEAD:extract-sibtorsh-results
