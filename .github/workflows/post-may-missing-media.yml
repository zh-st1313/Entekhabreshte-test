name: Fetch missing post-May result cards

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/post-may-missing-media.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch linked final cards
        run: |
          python - <<'PY'
          import os,re,html,json,requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers["User-Agent"]="Mozilla/5.0"
          sources={
            "fatemeh-noushadi":60276,
            "mahan-shabgard":59655,
            "matin-charkhab":55283,
            "mobina-vahedian":55148,
          }
          out="scratch/post-2026-05-25/missing-media"
          os.makedirs(out,exist_ok=True)
          manifest={}

          def get_page(mid):
              u=f"https://t.me/s/SiiibTorsh?before={mid+1}"
              r=s.get(u,timeout=30); r.raise_for_status()
              return r.text

          def find_wrap(body,mid):
              soup=BeautifulSoup(body,"html.parser")
              for w in soup.select("div.tgme_widget_message_wrap"):
                  if f"/{mid}" in str(w):
                      return w
              return None

          for key,src in sources.items():
              item={"source":src,"links":[],"target":None,"images":[]}
              body=get_page(src)
              w=find_wrap(body,src)
              if not w:
                  item["error"]="source_wrap_not_found"; manifest[key]=item; continue

              # Find the direct final-card link inside the post.
              for a in w.select("a[href]"):
                  txt=a.get_text(" ",strip=True)
                  href=a.get("href","")
                  if "کارنامه" in txt:
                      m=re.search(r'/(\d+)(?:\?single)?$',href)
                      if m:
                          item["links"].append({"text":txt,"href":href,"id":int(m.group(1))})
              final=[x for x in item["links"] if ("نهایی" in x["text"] or "قبولی" in x["text"])]
              if final:
                  target=final[0]["id"]
              elif item["links"]:
                  # Some posts only expose a generic rank/final pair; keep last link as candidate.
                  target=item["links"][-1]["id"]
              else:
                  item["error"]="no_card_link"; manifest[key]=item; continue
              item["target"]=target

              body2=get_page(target)
              w2=find_wrap(body2,target)
              if not w2:
                  item["error"]="target_wrap_not_found"; manifest[key]=item; continue

              td=os.path.join(out,key); os.makedirs(td,exist_ok=True)
              # Save target text for audit.
              te=w2.select_one("div.tgme_widget_message_text")
              item["target_text"]=te.get_text("\n",strip=True) if te else ""
              open(os.path.join(td,"target_text.txt"),"w",encoding="utf-8").write(item["target_text"])

              urls=[]
              for a in w2.select("a.tgme_widget_message_photo_wrap"):
                  style=a.get("style","")
                  m=re.search(r"background-image:url\('([^']+)'\)",style)
                  if m: urls.append(html.unescape(m.group(1)))
              if not urls:
                  for m in re.finditer(r"background-image:url\('([^']+)'\)",str(w2)):
                      u=html.unescape(m.group(1))
                      if "telesco.pe" in u: urls.append(u)
              urls=list(dict.fromkeys(urls))
              for i,u in enumerate(urls,1):
                  r=s.get(u,timeout=30)
                  if r.ok and len(r.content)>1000:
                      fn=f"{target}-{i}.jpg"
                      open(os.path.join(td,fn),"wb").write(r.content)
                      item["images"].append({"file":fn,"bytes":len(r.content),"url":u})
              manifest[key]=item

          open(os.path.join(out,"manifest.json"),"w",encoding="utf-8").write(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Commit fetched cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/post-2026-05-25/missing-media
          git diff --cached --quiet && exit 0
          git commit -m "extract: fetch four missing post-May result cards"
          git pull --rebase origin extract-sibtorsh-results
          git push origin HEAD:extract-sibtorsh-results
