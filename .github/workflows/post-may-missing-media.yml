name: Fetch Mobina final card

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/post-may-missing-media.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch card
        run: |
          python - <<'PY'
          import os,re,html,json,requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers["User-Agent"]="Mozilla/5.0"
          channel="SiiibTorsh_RiaziResult"; mid=681
          out="scratch/post-2026-05-25/mobina-final"
          os.makedirs(out,exist_ok=True)
          r=s.get(f"https://t.me/s/{channel}?before={mid+1}",timeout=30); r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          target=None
          for w in soup.select("div.tgme_widget_message_wrap"):
              if f"/{mid}" in str(w):
                  target=w; break
          if not target:
              raise SystemExit("target not found")
          te=target.select_one("div.tgme_widget_message_text")
          txt=te.get_text("\n",strip=True) if te else ""
          open(out+"/text.txt","w",encoding="utf-8").write(txt)
          imgs=[]
          for a in target.select("a.tgme_widget_message_photo_wrap"):
              m=re.search(r"background-image:url\('([^']+)'\)",a.get("style",""))
              if m: imgs.append(html.unescape(m.group(1)))
          imgs=list(dict.fromkeys(imgs))
          manifest={"channel":channel,"message":mid,"text":txt,"images":[]}
          for i,u in enumerate(imgs,1):
              rr=s.get(u,timeout=30)
              if rr.ok and len(rr.content)>1000:
                  fn=f"{mid}-{i}.jpg"; open(out+"/"+fn,"wb").write(rr.content)
                  manifest["images"].append({"file":fn,"bytes":len(rr.content),"url":u})
          open(out+"/manifest.json","w",encoding="utf-8").write(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/post-2026-05-25/mobina-final
          git diff --cached --quiet && exit 0
          git commit -m "extract: fetch Mobina Vahedian final card"
          git pull --rebase origin extract-sibtorsh-results
          git push origin HEAD:extract-sibtorsh-results
