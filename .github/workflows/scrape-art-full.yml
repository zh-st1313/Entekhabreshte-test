name: Scrape Kanoon art 1401-1404

on:
  push:
    paths:
      - ".github/workflows/scrape-art-full.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-art:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Extract complete Kanoon art data
        run: python scripts/scrape_kanoon_art.py --full

      - name: Validate generated CSVs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path("data/rank_admissions")
          counts = {}
          for year in (1401, 1402, 1403, 1404):
              p = root / f"rank_to_admission_{year}.csv"
              if not p.exists():
                  raise SystemExit(f"missing {p}")
              with p.open(encoding="utf-8-sig", newline="") as f:
                  rows = list(csv.DictReader(f))
              if not rows:
                  raise SystemExit(f"empty {p}")
              bad = [r for r in rows if r["سال"] != str(year) or r["گروه آزمایشی"] != "هنر"]
              if bad:
                  raise SystemExit(f"unexpected rows in {p}: {len(bad)}")
              counts[str(year)] = len(rows)

          summary = json.loads((root / "ART_1401_1404_SUMMARY.json").read_text(encoding="utf-8"))
          for year, count in counts.items():
              expected = summary["years"][year]["normalized_csv_rows"]
              if count != expected:
                  raise SystemExit(f"count mismatch {year}: csv={count} summary={expected}")
          print("VALIDATED", json.dumps(counts, ensure_ascii=False))
          PY

      - name: Commit extracted art data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/kanoon/art
          git add data/rank_admissions/rank_to_admission_1401.csv
          git add data/rank_admissions/rank_to_admission_1402.csv
          git add data/rank_admissions/rank_to_admission_1403.csv
          git add data/rank_admissions/rank_to_admission_1404.csv
          git add data/rank_admissions/ART_1401_1404_SUMMARY.json
          git diff --cached --stat
          git commit -m "data: add Kanoon art admissions 1401-1404"
          git push
