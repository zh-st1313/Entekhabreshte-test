name: Gozine2 expanded public recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-expanded:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 lxml
      - name: Expanded public Telegram recovery
        run: python scripts/gozine2_public_recovery_expanded.py
      - name: Show summary
        if: always()
        run: |
          test -f artifacts/gozine2-expanded/summary.json && cat artifacts/gozine2-expanded/summary.json || true
      - name: Upload expanded recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gozine2-expanded-recovery
          path: artifacts/gozine2-expanded/
          if-no-files-found: warn
          retention-days: 7
