name: Telegram media proof

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/telegram-media-proof.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results

      - name: Inspect Telegram public HTML
        run: |
          python - <<'PY'
          import html, os, re, urllib.request
          url = "https://t.me/s/SiiibTorsh?before=46453"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read().decode("utf-8","replace")

          out="scratch/telegram-media-test"
          os.makedirs(out, exist_ok=True)
          ids=re.findall(r'data-post="([^"]+)"',body)
          open(out+"/ids.txt","w",encoding="utf-8").write("\n".join(ids))

          # Save compact diagnostic snippets around target IDs and photo-related markup.
          parts=[]
          for needle in ["46450","46451","46452","tgme_widget_message_photo","background-image","cdn4.telegram-cdn","telegram-cdn"]:
              start=0
              hits=0
              while True:
                  i=body.find(needle,start)
                  if i<0 or hits>=8: break
                  parts.append(f"\n===== {needle} @ {i} =====\n"+body[max(0,i-1200):i+5000])
                  start=i+len(needle)
                  hits+=1
          open(out+"/debug.html.txt","w",encoding="utf-8").write("\n".join(parts))
          print("data-post count",len(ids),"targets",[x for x in ids if any(t in x for t in ("46450","46451","46452"))])
          PY

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/telegram-media-test
          git diff --cached --quiet && exit 0
          git commit -m "test: inspect Telegram public HTML"
          git push origin HEAD:extract-sibtorsh-results
