name: Telegram media proof

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/telegram-media-proof.yml

permissions:
  contents: write

jobs:
  single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Probe Telegram single-photo pages
        run: |
          python - <<'PY'
          import os,re,html,urllib.request,io
          from PIL import Image
          headers={"User-Agent":"Mozilla/5.0"}
          mids=[46449,47148,46179,46383,47169]
          out="scratch/telegram-1404-single-probe"
          os.makedirs(out,exist_ok=True)
          lines=[]
          for mid in mids:
              urls_pages=[
                f"https://t.me/siiibtorsh_official/{mid}?single",
                f"https://t.me/SiiibTorsh/{mid}?single",
                f"https://t.me/s/SiiibTorsh?before={mid+1}",
              ]
              seen=set()
              for pi,page in enumerate(urls_pages):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(page,headers=headers),timeout=30) as r:
                          body=r.read().decode("utf-8","replace")
                  except Exception as e:
                      lines.append(f"{mid}\tpage{pi}\tERR\t{e}")
                      continue
                  candidates=re.findall(r'https?://[^"\'<> )]+(?:\.jpg|\.jpeg|\.png|\.webp)[^"\'<> )]*',html.unescape(body),re.I)
                  for u in candidates:
                      if u in seen: continue
                      seen.add(u)
                      try:
                          with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=30) as r:
                              data=r.read()
                          try:
                              im=Image.open(io.BytesIO(data))
                              w,h=im.size
                          except Exception:
                              continue
                          lines.append(f"{mid}\tpage{pi}\t{w}x{h}\t{len(data)}\t{u}")
                          # Save largest plausible content images, not icons.
                          if w>=300 and h>=300:
                              fn=os.path.join(out,f"{mid}-p{pi}-{w}x{h}-{len(data)}.jpg")
                              try:
                                  Image.open(io.BytesIO(data)).convert("RGB").save(fn,quality=98)
                              except: pass
                      except Exception as e:
                          pass
          open(os.path.join(out,"manifest.tsv"),"w",encoding="utf-8").write("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - name: Commit probes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/telegram-1404-single-probe
          git diff --cached --quiet && exit 0
          git commit -m "extract: probe full-size Telegram single photos"
          git push origin HEAD:extract-sibtorsh-results
