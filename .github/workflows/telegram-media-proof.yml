name: Telegram media proof

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/telegram-media-proof.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results

      - name: Fetch Telegram public media
        run: |
          python - <<'PY'
          import os, re, urllib.request
          url = "https://t.me/s/SiiibTorsh?before=46453"
          headers={"User-Agent":"Mozilla/5.0"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
              body=r.read().decode("utf-8","replace")
          out="scratch/telegram-media-test"
          os.makedirs(out,exist_ok=True)

          targets={"46450","46451","46452"}
          rows=[]
          # Match each photo anchor and bind the CDN URL to the message id in href.
          pat=re.compile(r'<a[^>]+background-image:url\(\'(https?://[^\']+)\'\)[^>]+href="https://t\.me/[^/]+/(\d+)\?single"[^>]*>',re.I)
          for media_url,mid in pat.findall(body):
              if mid not in targets:
                  continue
              path=f"{out}/{mid}.jpg"
              with urllib.request.urlopen(urllib.request.Request(media_url,headers=headers),timeout=30) as r:
                  data=r.read()
              open(path,"wb").write(data)
              rows.append(f"{mid}\t{len(data)}\t{media_url}")
          open(out+"/manifest.txt","w",encoding="utf-8").write("\n".join(rows)+("\n" if rows else "NO_MEDIA_FOUND\n"))
          print(open(out+"/manifest.txt",encoding="utf-8").read())
          PY

      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/telegram-media-test
          git diff --cached --quiet && exit 0
          git commit -m "test: fetch Telegram rank-card media"
          git push origin HEAD:extract-sibtorsh-results
