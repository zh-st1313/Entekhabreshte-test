name: Telegram media proof

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/telegram-media-proof.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results
      - run: python -m pip install --quiet pillow
      - name: Crop uncertain course-type lines
        run: |
          python - <<'PY'
          from PIL import Image,ImageEnhance
          import os
          specs={
            6:"006-48154.jpg",
            9:"009-48454.jpg",
            10:"010-49677.jpg",
            28:"028-48973.jpg",
            47:"047-49521.jpg",
            48:"048-48109.jpg",
            49:"049-48111.jpg",
          }
          src="scratch/siibtorsh-post-2026-05-25/recovered-finalcards/cards"
          out="scratch/siibtorsh-post-2026-05-25/type-verify-crops"
          os.makedirs(out,exist_ok=True)
          for row,fn in specs.items():
            im=Image.open(os.path.join(src,fn)).convert("RGB")
            w,h=im.size
            # Produce three overlapping lower crops to handle variable result-line placement.
            boxes={
              "lower":(0,int(h*.55),w,h),
              "midlower":(0,int(h*.42),w,int(h*.82)),
              "full":(0,0,w,h),
            }
            for tag,box in boxes.items():
              c=im.crop(box)
              scale=4 if tag!="full" else 2
              c=c.resize((c.width*scale,c.height*scale))
              c=ImageEnhance.Contrast(c).enhance(1.18)
              c=ImageEnhance.Sharpness(c).enhance(1.45)
              c.save(os.path.join(out,f"row-{row:02d}-{tag}.jpg"),quality=96)
          PY
      - name: Commit crops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/siibtorsh-post-2026-05-25/type-verify-crops
          git diff --cached --quiet && exit 0
          git commit -m "extract: add course-type verification crops"
          git pull --rebase origin extract-sibtorsh-results
          git push origin HEAD:extract-sibtorsh-results
