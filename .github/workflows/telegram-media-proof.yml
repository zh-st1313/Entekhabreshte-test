name: Telegram media proof

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/telegram-media-proof.yml

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Isolate red rank figures
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          import os
          base="scratch/telegram-1404-batch2"
          specs={
            "nasa":"46452/46449.jpg",
            "ramila":"47151/47148.jpg",
            "elina":"46180/46179.jpg",
            "bardia":"46383/46383.jpg",
            "mohammadreza":"47170/47169.jpg",
          }
          out="scratch/telegram-1404-red-ranks"
          os.makedirs(out,exist_ok=True)
          for name,p in specs.items():
              im=Image.open(os.path.join(base,p)).convert("RGB")
              w,h=im.size
              # Rank figures are in the lowest quarter.
              c=im.crop((0,int(h*0.78),w,int(h*0.985)))
              # Red/magenta ink mask; keep broad threshold due JPEG compression.
              src=c.load()
              mask=Image.new("L",c.size,255)
              dst=mask.load()
              for y in range(c.height):
                  for x in range(c.width):
                      r,g,b=src[x,y]
                      red = (r > 95 and r > g*1.12 and r > b*1.05 and (r-g)>12)
                      dst[x,y]=0 if red else 255
              # Thicken isolated strokes slightly and upscale with nearest-neighbor.
              mask=mask.resize((mask.width*12,mask.height*12),Image.Resampling.NEAREST)
              mask.save(os.path.join(out,f"{name}-redmask.png"))
              mw,mh=mask.size
              mask.crop((0,0,int(mw*0.58),mh)).save(os.path.join(out,f"{name}-redmask-left.png"))
              mask.crop((int(mw*0.42),0,mw,mh)).save(os.path.join(out,f"{name}-redmask-right.png"))
          PY
      - name: Commit isolated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/telegram-1404-red-ranks
          git diff --cached --quiet && exit 0
          git commit -m "extract: isolate 1404 red rank figures"
          git push origin HEAD:extract-sibtorsh-results
