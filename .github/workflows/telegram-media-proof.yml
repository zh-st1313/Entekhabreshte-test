name: Telegram media proof

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/telegram-media-proof.yml

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Crop and upscale rank/admission fields
        run: |
          python - <<'PY'
          from PIL import Image, ImageEnhance
          import os
          base="scratch/telegram-1404-batch2"
          specs={
            "nasa":("46452/46449.jpg","48675/2.jpg"),
            "ramila":("47151/47148.jpg","52111/2.jpg"),
            "elina":("46180/46179.jpg","52110/2.jpg"),
            "bardia":("46383/46383.jpg","52089/2.jpg"),
            "mohammadreza":("47170/47169.jpg","52076/2.jpg"),
          }
          out="scratch/telegram-1404-crops"
          os.makedirs(out,exist_ok=True)
          for name,(rankp,admp) in specs.items():
            im=Image.open(os.path.join(base,rankp)).convert("RGB")
            w,h=im.size

            # Produce several zooms so no single crop assumption can hide a field.
            regions={
              "rank-mid": (0,int(h*0.40),w,int(h*0.80)),
              "rank-bottom": (0,int(h*0.65),w,h),
              "rank-full": (0,0,w,h),
            }
            for suffix,box in regions.items():
              c=im.crop(box)
              c=c.resize((c.width*4,c.height*4))
              c=ImageEnhance.Contrast(c).enhance(1.2)
              c=ImageEnhance.Sharpness(c).enhance(1.5)
              c.save(os.path.join(out,f"{name}-{suffix}.jpg"),quality=96)

            im=Image.open(os.path.join(base,admp)).convert("RGB")
            w,h=im.size
            for suffix,box in {
              "admission-mid":(0,int(h*0.35),w,h),
              "admission-full":(0,0,w,h)
            }.items():
              c=im.crop(box)
              c=c.resize((c.width*3,c.height*3))
              c=ImageEnhance.Contrast(c).enhance(1.15)
              c=ImageEnhance.Sharpness(c).enhance(1.3)
              c.save(os.path.join(out,f"{name}-{suffix}.jpg"),quality=96)
          PY

      - name: Commit crops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/telegram-1404-crops
          git diff --cached --quiet && exit 0
          git commit -m "extract: crop 1404 rank and admission fields"
          git push origin HEAD:extract-sibtorsh-results
