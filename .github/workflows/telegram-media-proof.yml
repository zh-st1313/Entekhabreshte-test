name: Telegram media proof

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/telegram-media-proof.yml

permissions:
  contents: write

jobs:
  easyocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results
      - name: Install EasyOCR
        run: python -m pip install --disable-pip-version-check easyocr
      - name: Read rank rows with Persian EasyOCR
        run: |
          python - <<'PY'
          import easyocr, os, json
          from PIL import Image
          base="scratch/telegram-1404-batch2"
          specs={
            "nasa":("46452/46449.jpg","1294"),
            "ramila":("47151/47148.jpg","2001"),
            "elina":("46180/46179.jpg","1058"),
            "bardia":("46383/46383.jpg","1004"),
            "mohammadreza":("47170/47169.jpg","1750"),
          }
          out="scratch/telegram-1404-easyocr"
          os.makedirs(out,exist_ok=True)
          reader=easyocr.Reader(['fa','en'],gpu=False,verbose=False)
          rows=[]
          for name,(p,known) in specs.items():
              im=Image.open(os.path.join(base,p)).convert("RGB")
              w,h=im.size
              # bottom 15%, where both national and quota ranks live
              c=im.crop((0,int(h*.84),w,h))
              fn=os.path.join(out,f"{name}-bottom.png")
              c.save(fn)
              for scale in [1,3,6]:
                  if scale==1:
                      use=fn
                  else:
                      q=c.resize((c.width*scale,c.height*scale),Image.Resampling.LANCZOS)
                      use=os.path.join(out,f"{name}-bottom-x{scale}.png")
                      q.save(use)
                  res=reader.readtext(use,detail=1,paragraph=False,
                                      allowlist="0123456789۰۱۲۳۴۵۶۷۸۹")
                  rows.append({
                    "name":name,"known_quota":known,"scale":scale,
                    "results":[{"box":x[0],"text":x[1],"conf":x[2]} for x in res]
                  })
          with open(os.path.join(out,"results.json"),"w",encoding="utf-8") as f:
              json.dump(rows,f,ensure_ascii=False,indent=2)
          for r in rows:
              print(r["name"],r["scale"],[(x["text"],round(x["conf"],3)) for x in r["results"]])
          PY
      - name: Commit OCR audit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/telegram-1404-easyocr/results.json
          git diff --cached --quiet && exit 0
          git pull --rebase origin extract-sibtorsh-results
          git push origin HEAD:extract-sibtorsh-results
