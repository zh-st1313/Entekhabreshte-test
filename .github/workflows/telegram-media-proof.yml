name: Telegram media proof

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/telegram-media-proof.yml

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results
      - name: Crop and upscale rank/admission fields
        run: |
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter
          import os
          base="scratch/telegram-1404-batch2"
          specs={
            "nasa":("46452/46449.jpg","48675/2.jpg"),
            "ramila":("47151/47148.jpg","52111/2.jpg"),
            "elina":("46180/46179.jpg","52110/2.jpg"),
            "bardia":("46383/46383.jpg","52089/2.jpg"),
            "mohammadreza":("47170/47169.jpg","52076/2.jpg"),
          }
          out="scratch/telegram-1404-crops"
          os.makedirs(out,exist_ok=True)
          for name,(rankp,admp) in specs.items():
            im=Image.open(os.path.join(base,rankp)).convert("RGB")
            w,h=im.size
            # Bottom 35% contains the rank summary / red rank figures.
            crop=im.crop((0,int(h*0.58),w,h))
            crop=crop.resize((crop.width*4,crop.height*4))
            crop=ImageEnhance.Contrast(crop).enhance(1.25)
            crop=ImageEnhance.Sharpness(crop).enhance(1.4)
            crop.save(os.path.join(out,f"{name}-rank.jpg"),quality=95)

            im=Image.open(os.path.join(base,admp)).convert("RGB")
            w,h=im.size
            # Lower half contains accepted major/university/course descriptor.
            crop=im.crop((0,int(h*0.55),w,h))
            crop=crop.resize((crop.width*3,crop.height*3))
            crop=ImageEnhance.Contrast(crop).enhance(1.2)
            crop.save(os.path.join(out,f"{name}-admission.jpg"),quality=95)
          PY
      - name: Commit crops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/telegram-1404-crops
          git diff --cached --quiet && exit 0
          git commit -m "extract: crop 1404 rank and admission fields"
          git push origin HEAD:extract-sibtorsh-results
