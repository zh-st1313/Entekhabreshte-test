name: Telegram media proof

on:
  push:
    branches:
      - extract-sibtorsh-results
    paths:
      - .github/workflows/telegram-media-proof.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extract-sibtorsh-results
      - name: Install Persian OCR once
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fas
          python -m pip install --disable-pip-version-check pillow
      - name: OCR rank summary only
        run: |
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageOps
          import os, subprocess
          base="scratch/telegram-1404-batch2"
          specs={
            "nasa":"46452/46449.jpg",
            "ramila":"47151/47148.jpg",
            "elina":"46180/46179.jpg",
            "bardia":"46383/46383.jpg",
            "mohammadreza":"47170/47169.jpg",
          }
          out="scratch/telegram-1404-ocr-check"
          os.makedirs(out,exist_ok=True)
          for name,p in specs.items():
              im=Image.open(os.path.join(base,p)).convert("L")
              w,h=im.size
              # Only the final rank section, to reduce OCR hallucination/noise.
              c=im.crop((0,int(h*0.72),w,int(h*0.99)))
              c=ImageOps.autocontrast(c)
              c=c.resize((c.width*5,c.height*5),Image.Resampling.LANCZOS)
              c=ImageEnhance.Sharpness(c).enhance(1.5)
              png=os.path.join(out,f"{name}.png")
              c.save(png)
              cmd=["tesseract",png,"stdout","-l","fas+eng","--psm","6"]
              p2=subprocess.run(cmd,capture_output=True,text=True)
              open(os.path.join(out,f"{name}.txt"),"w",encoding="utf-8").write(p2.stdout)
              print("\n====",name,"====\n",p2.stdout)
          PY
      - name: Commit OCR check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch/telegram-1404-ocr-check
          git diff --cached --quiet && exit 0
          git commit -m "extract: add one-off OCR verification for 1404 ranks"
          git push origin HEAD:extract-sibtorsh-results
